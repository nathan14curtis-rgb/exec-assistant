name = "idea-capture"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers AI — fallback transcription provider (TRANSCRIBE_PROVIDER = "workersai").
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DEDUPE"
id = "30bb89b028224d60aa448f0e513aaeec"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "idea-capture-audio"

# Source of truth. Create with `npx wrangler d1 create idea-capture` and paste the id.
[[d1_databases]]
binding = "DB"
database_name = "idea-capture"
database_id = "ca0b3d4d-4604-42a2-b68b-2a8fdb775442"
migrations_dir = "migrations"

# Producer: bound as env.CAPTURE_QUEUE inside the inbound adapters.
[[queues.producers]]
binding = "CAPTURE_QUEUE"
queue = "idea-capture"

# Consumer: max_retries 3 per the failure-handling spec.
[[queues.consumers]]
queue = "idea-capture"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4

# Lets `import icon from './icon.png'` pull the favicon bytes into the bundle.
[[rules]]
type = "Data"
globs = ["**/icon.png"]

[vars]
# Transcription provider: deepgram | workersai | groq
TRANSCRIBE_PROVIDER = "deepgram"
# Comma-separated vocabulary for Deepgram keyterm prompting. Leave empty for the built-in list.
TRANSCRIBE_KEYTERMS = ""
# Used for any "by Friday"-style date parsing.
USER_TZ = "America/Denver"
# The only number /inbox login codes are sent to, in E.164.
# Move this to a secret (`wrangler secret put OTP_PHONE`) if the repo is public.
OTP_PHONE = "+14355036688"

# Cloudflare Access protects /api/* (and the dashboard when it lands).
# Leave both empty to allow bearer-token access only.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
